name: Android CI - Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, Hamed.abyah1 ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Use runner's preinstalled Android SDK
        run: |
          # GitHub hosted ubuntu runners include Android SDK at /usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          sdkmanager --list || true

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Download Gradle Wrapper JAR
        run: |
          cd AIObjectDetector
          mkdir -p gradle/wrapper
          wget -q https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar

      - name: Build APK (Debug)
        env:
          GRADLE_USER_HOME: /home/runner/.gradle
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd AIObjectDetector
          chmod +x ./gradlew
          ./gradlew assembleDebug -x lint --no-daemon -g /home/runner/.gradle

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: AIObjectDetector/app/build/outputs/apk/debug/*.apk
