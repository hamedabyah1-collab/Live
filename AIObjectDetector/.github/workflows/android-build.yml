name: Android CI - Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, Hamed.abyah1 ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Use runner's preinstalled Android SDK
        run: |
          # GitHub hosted ubuntu runners include Android SDK at /usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          sdkmanager --list || true

      - name: Build APK (Debug)
        run: |
          cd AIObjectDetector
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug -x lint --no-daemon
          else
            gradle assembleDebug -x lint --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: AIObjectDetector/app/build/outputs/apk/debug/*.apk
